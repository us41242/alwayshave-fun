name = "alwayshave-fun"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
# Worker cron retired 2026-08-14: its GH_DISPATCH_TOKEN expired and 401'd
# silently. The pipeline now runs on GitHub Actions' own schedule trigger
# (fetch_conditions.yml) — no token to expire. Empty list removes the cron.
crons = []

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "none"
# worker.js rewrites pretty URLs to file paths; no asset-side redirects wanted.
html_handling = "none"
# Takedown 2026-08-31: Worker intercepts every request (site retired ahead of
# the vegas rebrand). Remove this line to serve static assets again.
run_worker_first = true
