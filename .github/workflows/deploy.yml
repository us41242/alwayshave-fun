name: Deploy to Cloudflare Workers

# Re-enabled 2026-09-02: the site is a Worker (worker.js + static assets), not
# Pages. Deploys on every push to main; also runnable by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned: the action's default wrangler (3.90) ignores
          # assets.run_worker_first, which let old trails files bypass the
          # Worker's 410 (found 2026-09-03). 4.81 is the local, verified version.
          wranglerVersion: "4.81.0"
          command: deploy
