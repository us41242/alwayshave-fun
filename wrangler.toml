name = "alwayshave-fun"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
# 30-min cadence matches the site's documented update promise; */20 was
# burning ~2,150 builds+workflow runs/mo for no user-visible freshness gain.
crons = ["*/30 * * * *"]

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
