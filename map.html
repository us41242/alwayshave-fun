<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visitor Map · alwayshave.fun</title>
  <meta name="description" content="Where alwayshave.fun visitors are checking trail air quality from — a live, privacy-first map (no IP, city-level only)." />
  <link rel="canonical" href="https://alwayshave.fun/map" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b1120; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 14px 18px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      border-bottom: 1px solid #1e293b; }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; }
    header a { color: #38bdf8; text-decoration: none; font-size: .85rem; }
    header .count { margin-left: auto; font-size: .85rem; color: #94a3b8; }
    #map { height: calc(100% - 52px); width: 100%; background: #0b1120; }
    .leaflet-popup-content { font-size: .85rem; }
    .note { font-size: .72rem; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>🗺️ Visitor Map</h1>
    <a href="/">← alwayshave.fun</a>
    <span class="count" id="count">Loading…</span>
  </header>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const SUPABASE_URL = "https://cuzyicjsyoddbeiosuxn.supabase.co";
    // Publishable anon key — safe in the browser; can only read the public points view.
    const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1enlpY2pzeW9kZGJlaW9zdXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTE3MjQsImV4cCI6MjA4OTIyNzcyNH0.8MQx80lhK3f9GRaOybM10hrGoryGb5NdG64kodFpdN8";

    const map = L.map("map", { worldCopyJump: true }).setView([38.5, -113.0], 5);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19, subdomains: "abcd",
    }).addTo(map);

    fetch(`${SUPABASE_URL}/rest/v1/site_visits_points?site=eq.ahf&select=lat,lon,city,region,country&limit=10000`, {
      headers: { apikey: ANON, Authorization: `Bearer ${ANON}` },
    })
      .then((r) => r.json())
      .then((rows) => {
        const pts = Array.isArray(rows) ? rows.filter((p) => p.lat != null && p.lon != null) : [];
        document.getElementById("count").textContent =
          pts.length ? `${pts.length.toLocaleString()} visits mapped` : "No visits yet";
        const bounds = [];
        for (const p of pts) {
          const place = [p.city, p.region, p.country].filter(Boolean).join(", ") || "Unknown";
          L.circleMarker([p.lat, p.lon], {
            radius: 5, color: "#38bdf8", weight: 1, fillColor: "#38bdf8", fillOpacity: 0.5,
          }).bindPopup(place).addTo(map);
          bounds.push([p.lat, p.lon]);
        }
        if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
      })
      .catch(() => {
        document.getElementById("count").textContent = "Couldn’t load map data";
      });
  </script>
</body>
</html>
