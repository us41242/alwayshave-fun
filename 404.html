<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Trail not found — alwayshave.fun</title>
  <style>
    :root { --bg:#0c1117; --surface:#161b22; --border:#30363d; --text:#e6edf3; --text-muted:#8b949e; --brand:#22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; line-height: 1.6; }
    .wrap { max-width: 560px; width: 100%; }
    h1 { font-size: 1.6rem; margin-bottom: 10px; }
    p { color: var(--text-muted); margin-bottom: 20px; }
    .states { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .states a, .home { display: inline-block; background: var(--surface); border: 1px solid var(--border);
                       color: var(--text); text-decoration: none; padding: 10px 16px; border-radius: 8px; }
    .states a:hover, .home:hover { border-color: var(--brand); color: var(--brand); }
    .home { background: var(--brand); color: #0c1117; border-color: var(--brand); font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>That trail isn't on the map.</h1>
    <p>The page you asked for doesn't exist — but live conditions for 46 trails do. Pick a state, or start from the top.</p>
    <div class="states">
      <a href="/ut">Utah</a>
      <a href="/az">Arizona</a>
      <a href="/nv">Nevada</a>
      <a href="/co">Colorado</a>
      <a href="/ca">California</a>
      <a href="/dog-friendly">Dog-friendly</a>
      <a href="/articles/">Trail guides</a>
    </div>
    <a class="home" href="/">See all trails and today's scores</a>
  </div>
</body>
</html>
