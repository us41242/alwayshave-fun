name: Fetch Trail Conditions

on:
  workflow_dispatch:
  # Native cron replaces the Cloudflare Worker cron (2026-08-14): the Worker's
  # GH_DISPATCH_TOKEN expired 2026-08-13 ~22:30Z and silently 401'd, stopping the
  # pipeline for 6h. No token here — GitHub fires it directly. UTC, ±jitter at
  # busy times is acceptable.
  #
  # 2026-08-28: cadence collapsed to ~2-3 runs/day starting 08-27 with "*/30"
  # (GitHub drops congested :00/:30 slots first). Moved to off-peak minutes
  # 13/43 — the documented mitigation. It didn't recover (~6 runs/day on
  # 08-29), so 2026-08-30 an external dispatch backstop was added: launchd job
  # com.joshuaedrake.ahf-dispatch on Josh's Mac runs scripts/dispatch_watchdog.py
  # every 20 min and fires workflow_dispatch if the latest run is >40 min old.
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write

concurrency:
  group: fetch-conditions
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Pull latest to avoid non-fast-forward push failures
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch scripts
        run: |
          python3 scripts/fetch_fires.py
          python3 scripts/fetch_conditions.py
          python3 scripts/condition_notifier.py
          python3 scripts/build_index.py
          # build_fires.py before generate_sitemap.py: the sitemap enumerates
          # generated/fires/*, so a brand-new incident page would otherwise miss
          # this run's sitemap and IndexNow ping by a full cycle.
          python3 scripts/build_fires.py
          python3 scripts/generate_sitemap.py
          python3 scripts/build_static.py
          python3 scripts/build_index_html.py
          python3 scripts/build_state_pages.py
          python3 scripts/build_dog_friendly.py
          python3 scripts/build_articles_index.py
          python3 scripts/indexnow.py
        env:
          AIRNOW_KEY: ${{ secrets.AIRNOW_KEY }}
          WAQI_KEY: ${{ secrets.WAQI_KEY }}
          NASA_FIRMS_KEY: ${{ secrets.NASA_FIRMS_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Commit and push data
        run: |
          git config user.name "Joshua Drake"
          git config user.email "us41242@gmail.com"
          git add data/ sitemap.xml generated/ articles/index.html index.html
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: update trail conditions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -X theirs origin main
          git push origin main

      - name: Purge Cloudflare cache
        env:
          CF_CACHE_PURGE_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          [ -z "$CF_CACHE_PURGE_TOKEN" ] && echo "No purge token, skipping" && exit 0
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_CACHE_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('Cache purge:', 'success' if d.get('success') else d.get('errors'))"
